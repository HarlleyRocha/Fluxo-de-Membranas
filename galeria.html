<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Fotos - Biomaket</title>
    <link rel="stylesheet" href="index.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</head>

<body>
    
    <nav>
        <a href="index.html" class="botao-icone">
            <span class="material-icons">
                home
            </span>
        </a>
    </nav>
    
    <div class="container">
        <header>
            <h1>Galeria de Imagens da Maquete</h1>
            <nav>
                <a href="materiais.html">Materiais</a>
                <a href="sobreotema.html">Sobre o Tema</a>
                <a href="galeria.html">Galeria de Fotos</a>
            </nav>
        </header>

        <main>
            <p>Confira os detalhes da nossa maquete do Modelo Mosaico Fluido e as etapas de construção:</p>

            <div class="galeria-grid">
                
                <figure class="item-galeria">
                    <img src="imagens/maquete_completa.jpg" alt="Vista geral da maquete">
                    <figcaption>Vista frontal da maquete completa e funcional.</figcaption>
                </figure>
                
                <figure class="item-galeria">
                    <img src="imagens/detalhe_transporte.jpg" alt="Detalhe da proteína transportadora">
                    <figcaption>Destaque no mecanismo de transporte ativo.</figcaption>
                </figure>

                <figure class="item-galeria">
                    <img src="imagens/bicamada.jpg" alt="Foco na bicamada de fosfolipídios">
                    <figcaption>A bicamada lipídica e suas cabeças hidrofílicas.</figcaption>
                </figure>
                
                <figure class="item-galeria">
                    <img src="imagens/proteina_periferica.jpg" alt="Proteínas ligadas à superfície">
                    <figcaption>Proteínas periféricas e integradas à membrana.</figcaption>
                </figure>
                
                <figure class="item-galeria">
                    <img src="imagens/endocitose.jpg" alt="Ilustração do transporte por vesículas">
                    <figcaption>Representação do transporte por vesículas (Endocitose).</figcaption>
                </figure>
                
                <figure class="item-galeria">
                    <img src="imagens/colesterol.jpg" alt="Representação do colesterol">
                    <figcaption>Moléculas de colesterol inseridas entre os fosfolipídios.</figcaption>
                </figure>
                
            </div>
            
        </main>
    </div>

    <footer>
        <p>© 2024 Biomaket - Projeto de Biologia Celular. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
